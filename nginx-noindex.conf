# PaperLib -- keep every area out of search indexes.
#
# This is for the deploy.sh serving model: deploy.sh rsyncs each area's dist/
# into /var/www/html/<prefix>/<area>/ and symlinks pdf/ -> the repo's raw/, so
# the pages are served by the web root's own `location /`, which sets no
# headers at all. nginx-install.sh covers the OTHER model, where pages are
# aliased from the repo and never copied, and sets the header itself. Use one
# model or the other, not both.
#
# One prefix location covers the portal, every area page and every PDF --
# current and future areas alike -- because nginx picks the LONGEST matching
# prefix, and /paperlib/ is longer than the web root's /.
#
# The PDFs are why the header is not optional. An HTML page can carry
# <meta name="robots" content="noindex"> and src/index.html does; a .pdf has no
# <head> to put it in, and search engines do index PDF text. For the papers,
# this header is the only thing there is.
#
# Deliberately NOT paired with `Disallow: /paperlib/` in robots.txt: a
# disallowed URL is never fetched, so the crawler never SEES this header, and
# the bare URL can still be listed on the strength of a third-party link.
# Allowing the fetch and answering with noindex is what actually keeps it out.
#
# It is NOT access control. It asks well-behaved crawlers not to index. It stops
# nobody who has the URL. If the host is reachable from outside the network, the
# publisher PDFs need a firewall or auth -- a header is not a substitute.
#
# Install: paste inside the `server { ... }` block that owns the web root
#          (Ubuntu default: /etc/nginx/sites-enabled/default), then
#              sudo nginx -t && sudo systemctl reload nginx
#          ./deploy.sh --check then proves it over HTTP.

# Deliberately NO `types { ... }` block here, unlike nginx-install.sh. That one
# has a location per area, with the PDFs in a SEPARATE location that the types
# block does not touch. This is a single prefix location covering pages and
# PDFs together, and declaring types inside a location replaces the map for
# everything it matches -- .pdf would fall through to the default and download
# instead of opening. The cost is that a .md digest downloads rather than
# opening inline; that is a content-type question, not an indexing one.

location /paperlib/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ =404;
}
